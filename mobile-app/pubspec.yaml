name: accident_detection
description: Accident Detection & Auto-Emergency-Response System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Sensors
  sensors_plus: ^4.0.2

  # Location & Maps
  geolocator: ^11.0.0
  google_maps_flutter: ^2.6.0
  geocoding: ^3.0.0

  # UI & Navigation
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.5.0
  lottie: ^3.1.0

  # Permissions
  permission_handler: ^11.3.0

  # HTTP & State
  http: ^1.2.0
  provider: ^6.1.2
  uuid: ^4.4.0

  # Local Storage
  sqflite: ^2.3.3
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # Background execution
  flutter_background_service: ^5.0.6
  flutter_local_notifications: ^17.1.2

  # Calling & SMS
  url_launcher: ^6.3.0

  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
